name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Verify formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        # Shuffled so a test that leaks state into the next one fails here
        # rather than mysteriously later.
        run: go test -race -shuffle=on -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1 >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        run: go build ./...

      - name: Confirm the icons match their generator
        run: |
          go run ./tools/genicons
          git diff --exit-code -- internal/web/assets

  image:
    name: Build image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # Build only; publishing happens in release.yml.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: unifi-protect-timelapse:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=ci-${{ github.sha }}
            REVISION=${{ github.sha }}

      - name: Smoke test the image
        run: |
          # The binary must start, print its version, and reject an empty
          # configuration with a useful message rather than a panic.
          docker run --rm unifi-protect-timelapse:ci version

          # Redirect rather than pipe: the exit status of a pipeline is the
          # status of its last command, which would always be tee's.
          if docker run --rm unifi-protect-timelapse:ci serve >/tmp/out 2>&1; then
            echo "expected an empty configuration to be rejected, but it started"
            cat /tmp/out
            exit 1
          fi
          cat /tmp/out
          grep -q "CAMERA_SNAPSHOT_URL" /tmp/out

      - name: Smoke test the Home Assistant add-on options path
        run: |
          set -eu
          # The Supervisor configures an add-on through this file, not the
          # environment. An ENV default baked into the image would silently win
          # over it, which is exactly the regression this guards.
          mkdir -p /tmp/addon/data
          cat > /tmp/addon/data/options.json <<'JSON'
          {
            "archive_path": "/media/timelapse",
            "camera_source": "snapshot",
            "camera_snapshot_url": "http://camera.invalid/snap.jpeg",
            "capture_enabled": false,
            "sync_mode": "off",
            "auth_mode": "ingress",
            "log_level": "debug"
          }
          JSON

          docker run --rm -v /tmp/addon/data:/data \
            unifi-protect-timelapse:ci serve >/tmp/addon-out 2>&1 &
          pid=$!
          sleep 5
          kill "$pid" 2>/dev/null || true
          cat /tmp/addon-out

          grep -q 'archive=/media/timelapse' /tmp/addon-out
          grep -q 'spool=/data/spool' /tmp/addon-out
          grep -q 'monitor=true' /tmp/addon-out
