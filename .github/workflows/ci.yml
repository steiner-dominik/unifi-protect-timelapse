name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Verify formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        # Shuffled so a test that leaks state into the next one fails here
        # rather than mysteriously later.
        run: go test -race -shuffle=on -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1 >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        run: go build ./...

      - name: Confirm the icons match their generator
        run: |
          go run ./tools/genicons
          git diff --exit-code -- internal/web/assets

  image:
    name: Build image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Build only; publishing happens in release.yml.
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: unifi-protect-timelapse:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=ci-${{ github.sha }}
            REVISION=${{ github.sha }}

      - name: Smoke test the image
        run: |
          # The binary must start, print its version, and reject an empty
          # configuration with a useful message rather than a panic.
          docker run --rm unifi-protect-timelapse:ci version

          # Redirect rather than pipe: the exit status of a pipeline is the
          # status of its last command, which would always be tee's.
          if docker run --rm unifi-protect-timelapse:ci serve >/tmp/out 2>&1; then
            echo "expected an empty configuration to be rejected, but it started"
            cat /tmp/out
            exit 1
          fi
          cat /tmp/out
          grep -q "CAMERA_SNAPSHOT_URL" /tmp/out

      - name: Smoke test the Home Assistant add-on options path
        run: |
          set -eu
          # The Supervisor configures an add-on through this file, not the
          # environment, and writes it as root with mode 0600 without changing
          # the container's user. Two regressions are guarded here: an ENV
          # default baked into the image silently winning over the options, and
          # the image dropping privileges so it cannot read them at all.
          #
          # A named volume is required: a bind mount would not preserve the
          # ownership that makes this a real test.
          docker volume create addon-data
          docker run --rm -v addon-data:/data alpine:3.22 sh -c '
            cat > /data/options.json <<JSON
          {
            "archive_path": "/media/timelapse",
            "camera_source": "snapshot",
            "camera_snapshot_url": "http://camera.invalid/snap.jpeg",
            "capture_enabled": false,
            "sync_mode": "off",
            "auth_mode": "ingress",
            "log_level": "debug"
          }
          JSON
            chown 0:0 /data/options.json && chmod 600 /data/options.json'

          docker run --rm -v addon-data:/data \
            unifi-protect-timelapse:ci serve >/tmp/addon-out 2>&1 &
          pid=$!
          sleep 5
          kill "$pid" 2>/dev/null || true
          cat /tmp/addon-out

          if grep -q 'permission denied' /tmp/addon-out; then
            echo "::error::The image cannot read its own add-on configuration. \
          Home Assistant add-ons run as root; do not set USER in the Dockerfile."
            exit 1
          fi
          grep -q 'archive=/media/timelapse' /tmp/addon-out
          grep -q 'spool=/data/spool' /tmp/addon-out
          grep -q 'monitor=true' /tmp/addon-out

      - name: Smoke test the standalone deployment as a non-root user
        run: |
          set -eu
          # Outside Home Assistant there is no options file, and compose pins a
          # normal user. That combination must keep working.
          docker run --rm --user 1000:1000 \
            -e CAMERA_SNAPSHOT_URL=http://camera.invalid/snap.jpeg \
            -e SPOOL_DIR=/tmp/spool -e STATE_DIR=/tmp/state -e SYNC_MODE=off \
            unifi-protect-timelapse:ci serve >/tmp/nonroot-out 2>&1 &
          pid=$!
          sleep 5
          kill "$pid" 2>/dev/null || true
          cat /tmp/nonroot-out

          grep -q 'web interface listening' /tmp/nonroot-out
