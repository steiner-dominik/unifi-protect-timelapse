name: Release

on:
  push:
    branches: [main]
    # Version scheme: YY.MM.NN, e.g. v26.09.01. NN is a sequence within the
    # month. This is deliberately not semver, so the tags below are built from
    # an exact match rather than docker/metadata-action's semver parser, which
    # rejects the zero-padded month and sequence.
    tags: ["v[0-9][0-9].[0-9][0-9].[0-9][0-9]"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine version and tags
        id: version
        run: |
          set -eu
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
            {
              echo "value=${version}"
              echo "release=true"
            } >> "$GITHUB_OUTPUT"
            {
              echo "tags<<EOF"
              echo "${REGISTRY}/${IMAGE_NAME}:${version}"
              echo "${REGISTRY}/${IMAGE_NAME}:latest"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "value=edge-$(git rev-parse --short HEAD)"
              echo "release=false"
              echo "tags=${REGISTRY}/${IMAGE_NAME}:edge"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Check the version is in the changelog
        if: steps.version.outputs.release == 'true'
        run: |
          set -eu
          version="${{ steps.version.outputs.value }}"
          if ! grep -q "^## ${version}\b" CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::CHANGELOG.md has no '## ${version}' section."
            exit 1
          fi

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          # armv7 is included so the image also runs on older single-board
          # hardware, not only on the x86 server.
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.version.outputs.tags }}
          labels: |
            org.opencontainers.image.title=unifi-protect-timelapse
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            REVISION=${{ github.sha }}

      - name: Attest the build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Assemble the release notes and assets
        if: steps.version.outputs.release == 'true'
        run: |
          set -eu
          version="${{ steps.version.outputs.value }}"
          mkdir -p dist

          # The deployment files are attached so they can be fetched without
          # cloning, and so each release keeps the pair that matches its image.
          cp compose.yaml dist/compose.yaml
          cp .env.example dist/env.example

          # Pull just this version's section out of the changelog.
          awk -v v="## ${version}" '
            $0 ~ "^"v"($| )" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > dist/notes.md

          {
            echo
            echo "### Container image"
            echo
            echo '```bash'
            echo "docker pull ${REGISTRY}/${IMAGE_NAME}:${version}"
            echo '```'
            echo
            echo "Also published as \`latest\`. Platforms: \`linux/amd64\`, \`linux/arm64\`, \`linux/arm/v7\`."
            echo
            echo "Digest: \`${{ steps.push.outputs.digest }}\`"
            echo
            echo "### Home Assistant add-on"
            echo
            echo "Set the add-on's \`version\` to \`${version}\` in"
            echo "[home-assistant-apps](https://github.com/steiner-dominik/home-assistant-apps)."
            echo
            echo "### Files"
            echo
            echo "\`compose.yaml\` and \`env.example\` below match this release."
          } >> dist/notes.md

      - name: Publish the GitHub release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file dist/notes.md \
            dist/compose.yaml dist/env.example

      - name: Summary
        run: |
          {
            echo "### Published"
            echo
            echo '```'
            echo "${{ steps.version.outputs.tags }}"
            echo '```'
            echo
            echo "Digest: \`${{ steps.push.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
